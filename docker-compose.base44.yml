services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach_dev
      POSTGRES_DB: kavach
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach"]
      interval: 3s
      timeout: 3s
      retries: 10

  setup:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install -g pnpm@10 && pnpm install --frozen-lockfile"
    environment:
      - CI=true

  api-server:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install -g pnpm@10 && cd artifacts/api-server && (node ./build.mjs --watch &) && sleep 3 && exec node --watch --enable-source-maps ./dist/index.mjs"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://kavach:kavach_dev@postgres:5432/kavach
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install -g pnpm@10 && pnpm --filter @workspace/kavach-wallet run dev"
    environment:
      - PORT=5173
      - BASE_PATH=/
    ports:
      - "3000:5173"
    depends_on:
      api-server:
        condition: service_started
      setup:
        condition: service_completed_successfully

volumes:
  pg_data:
